<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PricePilot | Compare Prices</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #17233c;
}

header {
  background: white;
  padding: 22px 8%;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 27px;
  font-weight: bold;
  color: #2463eb;
}

nav a {
  margin-left: 20px;
  text-decoration: none;
  color: #26334c;
}

.hero {
  text-align: center;
  padding: 75px 20px 40px;
}

.hero h1 { font-size: 42px; }

.hero p { color: #68758c; }

.search {
  display: flex;
  max-width: 650px;
  margin: 30px auto;
  padding: 8px;
  background: white;
  border-radius: 12px;
  box-shadow: 0 5px 25px #00000010;
}

.search input {
  flex: 1;
  min-width: 0;
  border: none;
  outline: none;
  padding: 15px;
  font-size: 16px;
}

button {
  background: #2463eb;
  color: white;
  border: none;
  padding: 14px 23px;
  border-radius: 8px;
  cursor: pointer;
}

button:hover { background: #174bbd; }

#results {
  max-width: 1050px;
  margin: 20px auto 60px;
  padding: 20px;
}

.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
}

.product {
  background: white;
  border-radius: 14px;
  padding: 24px;
  text-align: center;
  box-shadow: 0 4px 15px #00000008;
}

.product .image {
  font-size: 65px;
  padding: 20px;
}

.product h3 { font-size: 18px; }

.price {
  font-size: 23px;
  font-weight: bold;
  color: #2463eb;
}

.demo {
  color: #8993a4;
  font-size: 12px;
}

.category {
  display: inline-block;
  padding: 12px 20px;
  margin: 5px;
  background: white;
  border-radius: 10px;
  cursor: pointer;
}

.category:hover { background: #e4edff; }

footer {
  text-align: center;
  padding: 30px;
  color: #68758c;
}

@media(max-width: 600px) {
  .hero h1 { font-size: 32px; }
  header { padding: 18px 5%; }
}
</style>
</head>

<body>

<header>
  <div class="logo">PricePilot</div>
  <nav>
    <a href="#">Home</a>
    <a href="#categories">Categories</a>
  </nav>
</header>

<section class="hero">
  <h1>Find the Best Price. Every Time.</h1>
  <p>Search products, compare prices, and shop smarter.</p>

  <div class="search">
    <input id="searchInput"
    placeholder="Search for Nike shoes, headphones, TVs..."
    onkeydown="if(event.key==='Enter') searchProduct()">
    <button onclick="searchProduct()">Search</button>
  </div>
</section>

<section id="categories" style="text-align:center">
  <h2>Shop by Category</h2>
  <span class="category" onclick="searchCategory('electronics')">Electronics</span>
  <span class="category" onclick="searchCategory('clothing')">Clothing</span>
  <span class="category" onclick="searchCategory('sports')">Sports</span>
  <span class="category" onclick="searchCategory('home')">Home</span>
</section>

<section id="results">
  <h2>Popular Products</h2>
  <div class="products" id="productList"></div>
</section>

<footer>
  © 2026 PricePilot | Shop Smarter. Save More.
</footer>

<script>

const products = [
  {name:"Nike Air Force 1",price:115,category:"clothing",image:"👟",store:"Demo Store"},
  {name:"Apple AirPods Pro",price:189,category:"electronics",image:"🎧",store:"Demo Store"},
  {name:"Samsung 4K TV",price:399,category:"electronics",image:"📺",store:"Demo Store"},
  {name:"Wilson Golf Clubs",price:249,category:"sports",image:"⛳",store:"Demo Store"},
  {name:"Adidas Hoodie",price:55,category:"clothing",image:"👕",store:"Demo Store"},
  {name:"Gaming Headset",price:79,category:"electronics",image:"🎮",store:"Demo Store"},
  {name:"Basketball",price:30,category:"sports",image:"🏀",store:"Demo Store"},
  {name:"Desk Lamp",price:25,category:"home",image:"💡",store:"Demo Store"}
];

function displayProducts(items) {
  const list = document.getElementById("productList");

  if(items.length === 0) {
    list.innerHTML = "<p>No products found. Try another search.</p>";
    return;
  }

  list.innerHTML = items.map(product => `
    <div class="product">
      <div class="image">${product.image}</div>
      <h3>${product.name}</h3>
      <div class="price">$${product.price.toFixed(2)}</div>
      <p>${product.store}</p>
      <p class="demo">Sample price — not a live offer</p>
    </div>
  `).join("");
}

function searchProduct() {
  const search = document.getElementById("searchInput")
    .value.trim().toLowerCase();

  const matches = products.filter(product =>
    product.name.toLowerCase().includes(search) ||
    product.category.toLowerCase().includes(search)
  );

  document.getElementById("results").scrollIntoView();
  displayProducts(matches);
}

function searchCategory(category) {
  document.getElementById("searchInput").value = category;
  displayProducts(products.filter(p => p.category === category));
  document.getElementById("results").scrollIntoView();
}

displayProducts(products);

</script>

</body>
</html>
